name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20.x'
  MONGODB_URI: mongodb://localhost:27017/parkiq-test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    strategy:
      matrix:
        service: [user-service, parking-service, booking-service, payment-service, pricing-service]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Install service dependencies
      working-directory: services/${{ matrix.service }}
      run: npm install

    - name: Run linter
      working-directory: services/${{ matrix.service }}
      run: npm run lint --if-present

    - name: Run unit tests
      working-directory: services/${{ matrix.service }}
      run: npm test --if-present
      env:
        NODE_ENV: test
        MONGODB_URI: ${{ env.MONGODB_URI }}

    - name: Generate coverage report
      working-directory: services/${{ matrix.service }}
      run: npm run test:coverage --if-present
      env:
        NODE_ENV: test
        MONGODB_URI: ${{ env.MONGODB_URI }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        flags: ${{ matrix.service }}
        fail_ci_if_error: false

  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      working-directory: frontend
      run: npm install

    - name: Run linter
      working-directory: frontend
      run: npm run lint --if-present

    - name: Run frontend tests
      working-directory: frontend
      run: npm test --if-present

    - name: Build frontend
      working-directory: frontend
      run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    needs: [test, frontend-test]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Playwright browsers
      run: npx playwright install

    - name: Run E2E tests
      run: npm run test:e2e --if-present

    - name: Upload Playwright report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run security audit
      run: npm audit --audit-level=moderate

    - name: Run SNYK scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  deploy:
    runs-on: ubuntu-latest
    needs: [test, frontend-test, e2e-test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Add your deployment scripts here
        # Example: docker build & push, k8s deploy, etc.

    - name: Notify Slack
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "✅ ParkIQ deployment successful!"
          }
